<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6cbd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket Mail">
  <title>Pocket Mail</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="screen login" hidden>
    <div class="login-card">
      <img src="icon.svg" alt="" width="72" height="72">
      <h1>Pocket Mail</h1>
      <p class="muted">Введіть ключ доступу (<code>MAIL_APP_TOKEN</code>) з файлу <code>.env</code> на сервері.</p>
      <form id="login-form">
        <input id="login-token" type="password" autocomplete="current-password" placeholder="Ключ доступу" required>
        <button class="btn primary" type="submit">Увійти</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </section>

  <!-- Main: list -->
  <section id="main" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="open-drawer" aria-label="Папки">
        <span class="avatar small" id="me-avatar">?</span>
      </button>
      <h1 id="folder-title">Вхідні</h1>
      <button class="icon-btn" id="open-search" aria-label="Пошук">
        <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      </button>
    </header>
    <div class="searchbar" id="searchbar" hidden>
      <input id="search-input" type="search" placeholder="Пошук у пошті" enterkeyhint="search">
      <button class="link-btn" id="close-search">Скасувати</button>
    </div>
    <nav class="chips" id="filters">
      <button class="chip active" data-filter="all">Усі</button>
      <button class="chip" data-filter="unread">Непрочитані</button>
      <button class="chip" data-filter="flagged">З позначкою</button>
    </nav>
    <div class="ptr" id="ptr"><span>Потягніть, щоб оновити</span></div>
    <ul class="msg-list" id="msg-list"></ul>
    <div class="list-footer" id="list-footer"></div>
    <button class="fab" id="compose-btn" aria-label="Новий лист">
      <svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L17.9 9.9l-3.8-3.8L3 17.2Zm17.7-10.1a1 1 0 0 0 0-1.4l-2.4-2.4a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8 1.8-1.8Z"/></svg>
      <span>Новий лист</span>
    </button>
  </section>

  <!-- Drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="avatar" id="drawer-avatar">?</span>
      <div>
        <div id="drawer-name" class="strong"></div>
        <div id="drawer-email" class="muted small"></div>
      </div>
    </div>
    <ul class="folder-list" id="folder-list"></ul>
    <div class="drawer-foot">
      <button class="drawer-item" id="open-claude">
        <svg viewBox="0 0 24 24"><path d="M12 2 9.6 8.4 3 9.3l5 4.5L6.6 21 12 17.3 17.4 21 16 13.8l5-4.5-6.6-.9L12 2Z"/></svg>
        Підключити Claude
      </button>
      <button class="drawer-item" id="logout">
        <svg viewBox="0 0 24 24"><path d="M10 17v-3H3v-4h7V7l5 5-5 5Zm9 4H12v-2h7V5h-7V3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2Z"/></svg>
        Вийти
      </button>
    </div>
  </aside>

  <!-- Reader -->
  <section id="reader" class="screen overlay" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" id="r-flag" aria-label="Позначити">
        <svg viewBox="0 0 24 24"><path d="M5 21V4h9l.4 2H20v10h-7l-.4-2H7v7H5Z"/></svg>
      </button>
      <button class="icon-btn" id="r-archive" aria-label="Архівувати">
        <svg viewBox="0 0 24 24"><path d="M20.5 5.2 19.1 3.5A1.5 1.5 0 0 0 18 3H6a1.5 1.5 0 0 0-1.2.5L3.5 5.2A2 2 0 0 0 3 6.5V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.5a2 2 0 0 0-.5-1.3ZM12 17.5 6.5 12H10v-2h4v2h3.5L12 17.5ZM5.1 5l.8-1h12l.9 1H5.1Z"/></svg>
      </button>
      <button class="icon-btn" id="r-delete" aria-label="Видалити">
        <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"/></svg>
      </button>
      <button class="icon-btn" id="r-more" aria-label="Більше">
        <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
      </button>
    </header>
    <article class="reader-body" id="reader-body"></article>
    <footer class="reader-actions">
      <button class="action" id="r-reply">
        <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11Z"/></svg>Відповісти
      </button>
      <button class="action" id="r-reply-all">
        <svg viewBox="0 0 24 24"><path d="M7 8V5l-7 7 7 7v-3l-4-4 4-4Zm6 1V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11Z"/></svg>Усім
      </button>
      <button class="action" id="r-forward">
        <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11Z"/></svg>Переслати
      </button>
    </footer>
  </section>

  <!-- Compose -->
  <section id="compose" class="screen overlay" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="Закрити">
        <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
      <h1 id="compose-title">Новий лист</h1>
      <label class="icon-btn" aria-label="Вкласти файл">
        <input type="file" id="c-files" multiple hidden>
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 1 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 1 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 1 0-8 0v12.5a5.5 5.5 0 1 0 11 0V6h-1.5Z"/></svg>
      </label>
      <button class="icon-btn send" id="c-send" aria-label="Надіслати">
        <svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2v7Z"/></svg>
      </button>
    </header>
    <form class="compose-form" id="compose-form" autocomplete="on">
      <div class="field"><label for="c-to">Кому</label><input id="c-to" type="email" multiple inputmode="email" autocomplete="email"><button type="button" class="link-btn" id="c-show-cc">Копія</button></div>
      <div class="field" id="c-cc-row" hidden><label for="c-cc">Копія</label><input id="c-cc" type="email" multiple inputmode="email"></div>
      <div class="field" id="c-bcc-row" hidden><label for="c-bcc">Прихована</label><input id="c-bcc" type="email" multiple inputmode="email"></div>
      <div class="field"><label for="c-subject">Тема</label><input id="c-subject" type="text"></div>
      <div class="c-attachments" id="c-attachments"></div>
      <textarea id="c-body" placeholder="Текст листа"></textarea>
      <div class="c-quote muted small" id="c-quote" hidden></div>
    </form>
  </section>

  <!-- Claude connection -->
  <section id="claude" class="screen overlay" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <h1>Підключити Claude</h1>
      <div class="spacer"></div>
    </header>
    <div class="claude-body" id="claude-body"></div>
  </section>

  <!-- Bottom sheet (move / more) -->
  <div class="sheet" id="sheet" hidden><div class="sheet-inner" id="sheet-inner"></div></div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
